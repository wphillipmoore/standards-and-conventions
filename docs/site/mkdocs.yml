site_name: Standards and Conventions
site_description: Canonical standards and conventions reference
repo_url: https://github.com/wphillipmoore/standards-and-conventions
repo_name: wphillipmoore/standards-and-conventions

docs_dir: docs
strict: true
edit_uri: ""

extra:
  version:
    provider: mike

plugins:
  - search

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Releases:
      - Changelog: changelog.md
      - Release Notes:
          - releases/index.md
  - Standards:
      - Markdown Standards: standards/markdown-standards.md
      - Architecture Standards: standards/architecture-standards.md
  - AI Agents:
      - Overview: ai-agents/overview.md
      - Behavior:
          - Agent Guardrails: ai-agents/behavior/agent-guardrails.md
          - Agent Pre-Response Checklist: ai-agents/behavior/agent-pre-response-checklist.md
          - Agent Boot Banner: ai-agents/behavior/agent-boot-banner.md
      - Workflows:
          - AI-Assisted Development Loop: ai-agents/workflows/ai-assisted-development-loop.md
          - AI Code Review Guidelines: ai-agents/workflows/ai-code-review-guidelines.md
          - Interaction Contract: ai-agents/workflows/interaction-contract.md
      - Quality:
          - Cognitive Drift Log: ai-agents/quality/cognitive-drift-log.md
          - Cognitive Regression Tests: ai-agents/quality/cognitive-regression-tests.md
          - Interaction Contract Brief: ai-agents/quality/interaction-contract-brief.md
  - Code Management:
      - Overview: code-management/overview.md
      - Branching:
          - Branching and Deployment: code-management/branching/branching-and-deployment.md
          - Documentation Branching Model: code-management/branching/documentation-branching-model.md
          - Hotfix Policy: code-management/branching/hotfix-policy.md
      - Versioning:
          - Application Versioning Scheme: code-management/versioning/application-versioning-scheme.md
      - Source Control Guidelines: code-management/source-control-guidelines.md
      - GitHub Issues: code-management/github-issues.md
